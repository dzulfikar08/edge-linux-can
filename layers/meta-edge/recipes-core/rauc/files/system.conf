# RAUC system configuration: which slots this device has and how to switch them.
# https://rauc.readthedocs.io/en/latest/reference.html#system-configuration-file

[system]
# A bundle is installed only if its "compatible" matches this string exactly.
compatible=edge-qemuarm64
# Switch slots through U-Boot's environment (BOOT_ORDER, BOOT_x_LEFT) with
# fw_setenv; boot.cmd in the U-Boot recipe reads the same variables.
bootloader=uboot
# Slot status (installed bundle version, hashes, install time) is kept on the
# data partition, because the rootfs is read-only.
data-directory=/data/rauc
# Only accept verity bundles (signed, and every block checked on read).
bundle-formats=-plain

[keyring]
# Bundles must be signed by a certificate issued by this CA (the development
# CA from scripts/make-dev-keys.sh). Relative to this file's directory.
path=ca.cert.pem

# Two root filesystem slots of class "rootfs". bootname is what U-Boot calls
# them; the kernel command line says which one is running (rauc.slot=A).
[slot.rootfs.0]
device=/dev/vda2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/vda3
type=ext4
bootname=B
