# QEMU "virt" CFI flash, so Linux can read and write U-Boot's environment
# (fw_printenv / fw_setenv / RAUC). The device tree from QEMU describes the
# flash as "cfi-flash"; the physmap driver turns it into /dev/mtd0.
CONFIG_MTD=y
CONFIG_MTD_CFI=y
CONFIG_MTD_GEN_PROBE=y
CONFIG_MTD_CFI_ADV_OPTIONS=y
CONFIG_MTD_CFI_NOSWAP=y
CONFIG_MTD_MAP_BANK_WIDTH_1=y
CONFIG_MTD_MAP_BANK_WIDTH_2=y
CONFIG_MTD_MAP_BANK_WIDTH_4=y
CONFIG_MTD_CFI_I1=y
CONFIG_MTD_CFI_I2=y
CONFIG_MTD_CFI_INTELEXT=y
CONFIG_MTD_CFI_UTIL=y
CONFIG_MTD_PHYSMAP=y
CONFIG_MTD_PHYSMAP_OF=y
# overlayfs for /etc on the data partition (overlayfs-etc image feature)
CONFIG_OVERLAY_FS=y
