# SocketCAN protocol family and protocols
CONFIG_CAN=m
CONFIG_CAN_RAW=m
CONFIG_CAN_BCM=m
CONFIG_CAN_GW=m

# CAN device driver infrastructure (bit timing over netlink: `ip link set can0 type can bitrate ...`)
CONFIG_CAN_DEV=m
CONFIG_CAN_NETLINK=y
CONFIG_CAN_CALC_BITTIMING=y

# Virtual CAN (vcan0 inside the guest)
CONFIG_CAN_VCAN=m

# QEMU -device kvaser_pci (SJA1000 based, classic CAN)
CONFIG_CAN_SJA1000=m
CONFIG_CAN_KVASER_PCI=m

# QEMU -device ctucan_pci (CTU CAN FD)
CONFIG_CAN_CTUCANFD=m
CONFIG_CAN_CTUCANFD_PCI=m
