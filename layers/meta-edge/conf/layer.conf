BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "edge"
BBFILE_PATTERN_edge = "^${LAYERDIR}/"
BBFILE_PRIORITY_edge = "10"

LAYERDEPENDS_edge = "core openembedded-layer rauc"
LAYERSERIES_COMPAT_edge = "wrynose"

# Put lib/ on bitbake's Python path, in the oeqa namespace. testimage finds
# test case files (lib/oeqa/runtime/cases/*.py) by scanning layers anyway,
# but data files next to them, such as parselogs-ignores-aarch64.txt, are
# looked up through the import path and are only found with this.
addpylib ${LAYERDIR}/lib oeqa

# Development signing keys for RAUC (created by scripts/make-dev-keys.sh,
# not committed). The image trusts ca.cert.pem; the bundle recipes sign with
# signing.key.pem / signing.cert.pem.
EDGE_KEYS_DIR := "${@os.path.normpath('${LAYERDIR}/../../keys/dev')}"

# Top directory of this repository (/repo in the kas container). The
# testimage case (lib/oeqa/runtime/cases/edge_can.py) loads scripts/minidbc.py
# and docs/can-demo.dbc from it; a fork could also fetch can-demo from it
# (see the can-demo recipe).
EDGE_REPO_DIR := "${@os.path.normpath('${LAYERDIR}/../..')}"
