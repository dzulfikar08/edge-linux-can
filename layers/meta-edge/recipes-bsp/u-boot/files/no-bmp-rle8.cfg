# The device has no display: build U-Boot without its video stack.
# That removes BMP decoding, including video_display_rle8_bitmap()
# (drivers/video/video_bmp.c), which had an out-of-bounds write
# (CVE-2026-71972) reachable from a crafted BMP, for example a PXE menu
# background fetched over the network. The console stays on the serial port.
#
# Why not just "# CONFIG_VIDEO_BMP_RLE8 is not set": VIDEO_LOGO (default y)
# selects it, and a Kconfig "select" wins over a fragment. Disabling
# VIDEO_LOGO alone does not link in U-Boot 2026.01 (video_get_u_boot_logo()
# still references the logo). Check the result in build/.config, not in
# merge_config's output: it only reports what the fragment asked for.
# CONFIG_VIDEO is not set
