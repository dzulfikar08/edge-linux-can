# Extra configuration for `bitbake -c testimage` when host vcan0 is up
# (scripts/testimage.sh passes it with `bitbake -R`): the guest gets a CTU CAN
# FD controller on a QEMU CAN bus bridged to host vcan0 (guest can0; the
# card's second controller, can1, gets an empty bus of its own), and the
# edge_can test case also checks traffic in both directions across the bridge.
# Needs the kas container to share the host network namespace.
EDGE_CAN_HOST = "vcan0"
TEST_QEMUPARAMS = "-device i6300esb -object can-bus,id=canbus0 \
    -object can-host-socketcan,id=canhost0,if=vcan0,canbus=canbus0 \
    -object can-bus,id=canbus1 \
    -device ctucan_pci,canbus0=canbus0,canbus1=canbus1"
