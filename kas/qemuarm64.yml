# kas build configuration: Yocto 6.0 "Wrynose" (LTS), qemuarm64, systemd.
# Build:  scripts/kas build kas/qemuarm64.yml
header:
  version: 18

machine: qemuarm64
distro: poky
target:
  - edge-image          # disk image (wic): U-Boot script, rootfs A, empty rootfs B, data
  - edge-bundle         # signed RAUC update bundle with edge-image-update (version 1.1.0)
  - edge-bundle-broken  # signed bundle whose can-demo fails: used to test rollback
  - edge-image-test     # edge-image + ptest-runner, can-demo-ptest, ssh: for testimage

defaults:
  repos:
    # Layers are pinned to wrynose branch heads of 2026-11-11: yocto-6.0.4
    # plus the stable fixes merged since (no 6.0.5 tag yet). Bump: git
    # ls-remote <url> wrynose (bitbake: 2.18), see docs/build-journal.md part 4.
    branch: wrynose

repos:
  # This repository: provides layers/meta-edge.
  edge-linux-can:
    layers:
      layers/meta-edge:

  # oe-core no longer ships bitbake; oe-init-build-env finds it in ../bitbake,
  # so the repo names below matter (kas checks them out side by side).
  bitbake:
    url: https://git.openembedded.org/bitbake
    commit: 6e260eb6ab1631607ea414d9ff8ede1155faa5d9   # 2.18 head 2026-11-11 (yocto-6.0.4 + 1)
    branch: "2.18"
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    commit: 2285da08068a6d1b4a64c9a52d85a58be50e4679   # wrynose head 2026-11-11 (yocto-6.0.4 + 83)
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    commit: 79b6d87030178bed0088ad3b00aa6dfbabac37c4   # wrynose head 2026-11-11 (yocto-6.0.4 + 1)
    layers:
      meta-poky:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: c0fcd7cca3760ef24e087ac4a31b8f357cb204da   # wrynose head (unchanged 2026-11-11)
    layers:
      meta-oe:          # can-utils

  # RAUC: A/B update client, bundle class, kernel/busybox config it needs.
  meta-rauc:
    url: https://github.com/rauc/meta-rauc
    commit: 38da0e5866a953e664001ba90b5edad68d68cd5d   # wrynose head (2026-06-02, RAUC 1.15.2; unchanged 2026-11-11)
    layers:
      .:

local_conf_header:
  init: |
    INIT_MANAGER = "systemd"
  headless: |
    # A headless CAN device: no display, GPU, sound or radios. Poky enables
    # all of these by default; with x11 on, dbus pulls libx11 into the image
    # (dbus-launch). Removing them shrinks the image and its CVE surface.
    # Kept: ptest (can-demo-ptest), pci, seccomp, acl/xattr, ipv4/ipv6, vfat
    # (boot partition), nfs, zeroconf, debuginfod, ldconfig, multiarch.
    DISTRO_FEATURES:remove = "x11 wayland opengl vulkan pulseaudio gobject-introspection-data alsa bluetooth wifi nfc 3g"
  update: |
    # RAUC A/B updates. The distro feature turns on meta-rauc's kernel and
    # busybox config fragments (loop, squashfs, dm-verity for verity bundles).
    DISTRO_FEATURES:append = " rauc"
    # Boot through U-Boot instead of QEMU loading the kernel directly: U-Boot
    # picks slot A or B and counts boot attempts (see layers/meta-edge/recipes-bsp/u-boot).
    PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
  disk: |
    # Delete each recipe's work dir once it is packaged: keeps tmp/ small.
    INHERIT += "rm_work"
    # Keep the hash equivalence database next to the shared sstate cache.
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"
    # Abort cleanly before the build disk fills up.
    BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},1G,100K STOPTASKS,${DL_DIR},1G,100K STOPTASKS,${SSTATE_DIR},1G,100K HALT,${TMPDIR},100M,1K"
  parallel: |
    # 12 cores / 30 GB RAM: leave headroom for rustc and the desktop.
    BB_NUMBER_THREADS = "8"
    PARALLEL_MAKE = "-j 8"
  dev: |
    # Development image only: root logs in without a password on the serial console.
    EXTRA_IMAGE_FEATURES = "allow-empty-password empty-root-password allow-root-login"
  qemu: |
    # runqemu: no graphics, serial console on stdio.
    QB_GRAPHICS = ""
  test: |
    # oeqa runtime tests: `bitbake -c testimage edge-image-test` (scripts/testimage.sh).
    # The class only adds the task; nothing runs during a normal build.
    IMAGE_CLASSES += "testimage"
    # User-mode networking: no tap device, so no root needed. oeqa reaches
    # the guest's ssh through a forwarded port on 127.0.0.1.
    TEST_RUNQEMUPARAMS = "slirp"
    TEST_SERVER_IP = "10.0.2.2"
    # The same i6300esb watchdog the other tests give the guest.
    # kas/testimage-can.conf adds the CAN FD controller bridged to host vcan0.
    TEST_QEMUPARAMS = "-device i6300esb"
    TEST_QEMUBOOT_TIMEOUT = "900"
    # ping/ssh/date/systemd/ptest/parselogs come with oe-core; edge_can is
    # layers/meta-edge/lib/oeqa/runtime/cases/edge_can.py.
    TEST_SUITES = "ping ssh date systemd ptest parselogs edge_can"
    # Re-read at test time (not frozen in the image's testdata.json).
    TESTIMAGE_UPDATE_VARS:append = " EDGE_CAN_HOST"
    EDGE_CAN_HOST ?= ""
  sbom: |
    # SPDX 3.0 SBOMs (create-spdx, on by default in poky) and CVE analysis of
    # each image's SBOM with sbom-cve-check. Same settings as oe-core's
    # fragment core/yocto/sbom-cve-check, except that the CVE databases are
    # pinned (the fragment uses AUTOREV, i.e. a new download on every build).
    IMAGE_CLASSES += "sbom-cve-check"
    # VEX: every known CVE with its status (patched, ignored, unpatched).
    SPDX_INCLUDE_VEX = "all"
    # List the kernel source files that were compiled, so CVEs in drivers
    # this kernel does not build can be told apart.
    SPDX_INCLUDE_COMPILED_SOURCES:pn-linux-yocto = "1"
    # CVE databases as of 2026-11-11 04:55 UTC. Bump: git ls-remote <url> main.
    SRCREV:pn-sbom-cve-check-update-nvd-native = "bb8f10f14a5fae4605f71e805dea47de3cd42802"
    SRCREV:pn-sbom-cve-check-update-cvelist-native = "fdf0970a45fc52e2ebe6df0687758d53d5ff2acc"
    # Shallow clones (one commit) of the two database repositories instead of
    # their full histories (several GB each).
    BB_GIT_SHALLOW:pn-sbom-cve-check-update-nvd-native = "1"
    BB_GIT_SHALLOW:pn-sbom-cve-check-update-cvelist-native = "1"
